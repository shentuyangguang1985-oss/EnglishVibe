<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#7D93CD">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="EnglishVibe - 初中英语单词学习助手，图背单词，轻松记忆">
  
  <title>EnglishVibe - 英语单词学习</title>
  
  <!-- 样式 -->
  <link rel="stylesheet" href="./css/style.css">
  
  <!-- PWA 图标 -->
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部导航 -->
    <header class="header">
      <div class="header__logo">
        <span class="header__logo-icon">📚</span>
        <span class="header__logo-text">EnglishVibe</span>
      </div>
      <button class="header__settings" id="btn-settings" aria-label="设置">
        ⚙️
      </button>
    </header>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 今日任务卡片 -->
      <div class="task-card fade-in">
        <div class="task-card__title">
          <span class="task-card__title-icon">📖</span>
          今日学习任务
        </div>
        
        <div class="task-card__stats">
          <div class="task-card__stat">
            <span class="task-card__stat-label">新学</span>
            <span class="task-card__stat-value">
              <span id="stat-new-learned">0</span> / <span id="stat-daily-goal">20</span> 词
            </span>
          </div>
          <div class="task-card__stat">
            <span class="task-card__stat-label">待复习</span>
            <span class="task-card__stat-value task-card__stat-value--warning" id="stat-review-count">
              0 词
            </span>
          </div>
          <div class="task-card__stat">
            <span class="task-card__stat-label">今日正确率</span>
            <span class="task-card__stat-value task-card__stat-value--highlight" id="stat-accuracy">
              --
            </span>
          </div>
        </div>

        <!-- 当前学习阶段 -->
        <div class="progress-section" id="stage-section" style="margin-bottom: 8px;">
          <div class="progress-section__header">
            <span class="progress-section__label">📚 当前阶段</span>
            <span class="progress-section__value" id="current-stage-name">--</span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar__fill" id="stage-progress-fill" style="width: 0%; background: var(--success);"></div>
          </div>
          <div style="font-size: 12px; color: var(--text-light); margin-top: 4px;">
            阶段进度: <span id="stage-learned">0</span> / <span id="stage-total">0</span> 词
          </div>
        </div>

        <!-- 总进度 -->
        <div class="progress-section">
          <div class="progress-section__header">
            <span class="progress-section__label">总进度</span>
            <span class="progress-section__value">
              <span id="stat-total-learned">0</span> / <span id="stat-total-words">0</span> 词
              <span class="progress-percent" id="progress-percent">(0%)</span>
            </span>
          </div>
          <div class="progress-bar">
            <div class="progress-bar__fill" id="progress-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- 已掌握统计 -->
        <div class="mastered-section">
          <div class="mastered-stat">
            <span class="mastered-stat__icon">✅</span>
            <span class="mastered-stat__label">已掌握</span>
            <span class="mastered-stat__value" id="stat-mastered">0</span>
            <span class="mastered-stat__unit">词</span>
          </div>
          <div class="mastered-stat">
            <span class="mastered-stat__icon">🔥</span>
            <span class="mastered-stat__label">连续</span>
            <span class="mastered-stat__value" id="stat-streak">0</span>
            <span class="mastered-stat__unit">天</span>
          </div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="action-buttons">
        <button class="btn btn--primary" id="btn-learn">
          <span class="btn__icon">🎯</span>
          开始学习
        </button>
        
        <button class="btn btn--secondary" id="btn-review" style="display: none;">
          <span class="btn__icon">🔄</span>
          开始复习
          <span class="btn__badge" id="review-badge">0</span>
        </button>
        
        <!-- 安装到桌面按钮 -->
        <button class="btn btn--secondary" id="btn-install" style="border: 2px dashed var(--secondary);">
          <span class="btn__icon">📲</span>
          安装到桌面
        </button>
      </div>
    </main>

    <!-- 底部信息 -->
    <footer class="footer-info">
      <span class="footer-info__icon">📅</span>
      预计完成：还需 <span class="footer-info__highlight" id="stat-remaining-days">--</span> 天
      <br>
      <small>（按每天 <span id="stat-daily-goal-footer">20</span> 词计算）</small>
    </footer>
  </div>

  <!-- 加载提示 -->
  <div id="loading" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; z-index: 9999;">
    <div style="text-align: center;">
      <div style="font-size: 48px; margin-bottom: 16px;">📚</div>
      <div style="color: #6B778D;">加载中...</div>
    </div>
  </div>

  <!-- 脚本 -->
  <script src="./js/storage.js"></script>
  <script src="./js/vocabulary.js"></script>
  <script src="./js/app.js"></script>
  
  <!-- Service Worker 注册 -->
  <script>
    // 注册 Service Worker 实现 PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('SW registered:', registration.scope);
            // 检查更新
            registration.update();
            // 当发现新版本时，立即激活
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New SW available, reloading...');
                  window.location.reload();
                }
              });
            });
          })
          .catch(error => {
            console.log('SW registration failed:', error);
          });
      });
      // 监听控制器变化，自动刷新
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    }
    
    // PWA 安装提示
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      // 阻止默认提示
      e.preventDefault();
      deferredPrompt = e;
      console.log('PWA install prompt ready');
    });
    
    // 绑定安装按钮事件
    document.addEventListener('DOMContentLoaded', () => {
      const installBtn = document.getElementById('btn-install');
      if (installBtn) {
        installBtn.addEventListener('click', installApp);
      }
      
      // 检查是否已安装（standalone模式）
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
        // 已安装，隐藏按钮
        if (installBtn) installBtn.style.display = 'none';
      }
    });
    
    async function installApp() {
      if (deferredPrompt) {
        // 浏览器支持安装提示
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
          console.log('User accepted the install prompt');
          const installBtn = document.getElementById('btn-install');
          if (installBtn) installBtn.style.display = 'none';
        }
        deferredPrompt = null;
      } else {
        // 浏览器不支持自动安装提示，显示手动安装说明
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        
        let message = '📲 安装到桌面：\n\n';
        if (isIOS) {
          message += '1. 点击底部的分享按钮 ⬆️\n2. 选择"添加到主屏幕"';
        } else if (isAndroid) {
          message += '1. 点击右上角菜单 ⋮\n2. 选择"添加到主屏幕"或"安装应用"';
        } else {
          message += '请使用浏览器菜单中的"安装"或"添加到主屏幕"选项';
        }
        alert(message);
      }
    }
    
    // 监听安装完成
    window.addEventListener('appinstalled', () => {
      console.log('PWA was installed');
      deferredPrompt = null;
      const installBtn = document.getElementById('btn-install');
      if (installBtn) installBtn.style.display = 'none';
    });
  </script>
</body>
</html>
